# Local development database: ONE Postgres, one schema (and one login role) per service.
# Schemas/roles are created by deploy/db/init-schemas.sh the first time the volume is empty.
# Passwords come from .env (see .env.example).
#   docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: saschoolsport-db
    environment:
      POSTGRES_DB: saschoolsport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      AUTHZ_DB_PASSWORD: ${AUTHZ_DB_PASSWORD:?set AUTHZ_DB_PASSWORD in .env}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD in .env}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saschoolsport"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
