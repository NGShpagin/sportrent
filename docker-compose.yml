# Local development databases. Ports match each service's application.yaml;
# passwords come from .env (see .env.example).
#   docker compose up -d
services:
  users-db:
    image: postgres:17-alpine
    container_name: saschoolsport-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-db:
    image: postgres:17-alpine
    container_name: saschoolsport-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  authz-db:
    image: postgres:17-alpine
    container_name: saschoolsport-authz-db
    environment:
      POSTGRES_DB: authz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTHZ_DB_PASSWORD:?set AUTHZ_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - authz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authz_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  users-db-data:
  auth-db-data:
  authz-db-data:
