server:
  port: 8081

spring:
  config:
    # Secrets come from environment variables. For local development they are read from a
    # gitignored .env file (repo root; "../" covers running from a module directory).
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/saschoolsport?currentSchema=users
    username: users_svc
    password: ${USERS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    schemas: [users]
    default-schema: users
  cloud:
    discovery:
      enabled: true
  web:
    resources:
      add-mappings: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  internal-api-key: ${INTERNAL_API_KEY}
