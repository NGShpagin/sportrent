# Full stack for a server (VPS):  databases + Eureka + services + gateway + Caddy (HTTPS).
# Only Caddy publishes ports (80/443); everything else lives on the internal network.
#
#   cp .env.example .env   # fill in ALL values (incl. DOMAIN for HTTPS)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile stubs up -d
#
# Images are built locally by default (saschoolsport/<service>:latest). CI (.github/workflows/ci-cd.yml)
# publishes them to GHCR and deploys with IMAGE_PREFIX=ghcr.io/<owner>/saschoolsport IMAGE_TAG=<git sha>,
# using `pull` + `up -d --no-build` instead of building on the server.
#
# docker-compose.yml stays the "databases only" file for local development and the e2e scripts.

x-service: &service
  restart: unless-stopped
  networks: [backend]
  environment: &service-env
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    # register by IP: container hostnames are not resolvable from every other container
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}

x-healthcheck: &healthcheck-base
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 60s

services:
  # ---------- database: one Postgres, one schema + login role per service (port 5432 open for readonly workshop access) ----------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: saschoolsport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      AUTHZ_DB_PASSWORD: ${AUTHZ_DB_PASSWORD:?set AUTHZ_DB_PASSWORD in .env}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      PROMOCODE_DB_PASSWORD: ${PROMOCODE_DB_PASSWORD:?set PROMOCODE_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD in .env}
    # published for workshop students (readonly role only; service roles stay unused from outside)
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # creates the schemas and roles on the first start with an empty volume
      - ./deploy/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saschoolsport"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- discovery ----------
  eureka-server:
    <<: *service
    build: { context: ., dockerfile: eureka-server/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/eureka-server:${IMAGE_TAG:-latest}
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]

  # ---------- business services ----------
  user-service:
    <<: *service
    build: { context: ., dockerfile: user-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/user-service:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=users
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]

  authz-service:
    <<: *service
    build: { context: ., dockerfile: authz-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/authz-service:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=authz
      AUTHZ_DB_PASSWORD: ${AUTHZ_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      # DataInitializer calls user-service on start-up
      user-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  auth-service:
    <<: *service
    build: { context: ., dockerfile: auth-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/auth-service:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      user-service: { condition: service_healthy }
      authz-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  cart-service:
    <<: *service
    build: { context: ., dockerfile: cart-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/cart-service:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=cart
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]

  order-service:
    <<: *service
    build: { context: ., dockerfile: order-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/order-service:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=orders
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]

  promocode-service:
    <<: *service
    build: { context: ., dockerfile: promocode-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/promocode-service:${IMAGE_TAG:-latest}
    mem_limit: 512m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=promocodes
      PROMOCODE_DB_PASSWORD: ${PROMOCODE_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]

  catalog-service:
    <<: *service
    build: { context: ., dockerfile: catalog-service/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/catalog-service:${IMAGE_TAG:-latest}
    mem_limit: 512m
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/saschoolsport?currentSchema=catalog
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

  # ---------- gateway (reachable only through Caddy) ----------
  api-gateway:
    <<: *service
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    image: ${IMAGE_PREFIX:-saschoolsport}/api-gateway:${IMAGE_TAG:-latest}
    mem_limit: 640m
    environment:
      <<: *service-env
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      eureka-server: { condition: service_healthy }
      user-service: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      authz-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck-base
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [backend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api-gateway: { condition: service_healthy }

networks:
  backend:

volumes:
  db-data:
  caddy-data:
  caddy-config:
